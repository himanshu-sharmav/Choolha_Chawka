<!DOCTYPE html>
<html>
<head>
    <title>Payment Reminder</title>
</head>
<body>
    <h2>Hi {{ user_name }},</h2>
    <p>This is a reminder to complete your payment of ₹{{ amount }} for your <strong>{{ plan_name }}</strong> subscription.</p>
    <p>Your subscription has been pending for {{ days_pending }} day{{ days_pending|pluralize }}.</p>
    <p><a href="{{ payment_url }}">Pay Now</a></p>
    <p>Best regards,<br>Choolha Chawka Team</p>
</body>
</html>
