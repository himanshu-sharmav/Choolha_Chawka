<!DOCTYPE html>
<html>
<head>
    <title>Leave Rejected</title>
</head>
<body>
    <h2>Hi {{ user_name }},</h2>
    <p>We're sorry to inform you that your leave request ({{ start_date }} to {{ end_date }}) has been rejected.</p>
    {% if admin_comment %}
    <p><strong>Admin Comment:</strong> {{ admin_comment }}</p>
    {% endif %}
    <p>If you have questions, contact {{ support_email }}.</p>
    <p>Best regards,<br>Choolha Chowka Team</p>
</body>
</html>
